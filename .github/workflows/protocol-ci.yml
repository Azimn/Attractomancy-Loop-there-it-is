name: EXP-0001 protocol integrity
on:
  push:
    paths:
      - "experiments/EXP-0001/**"
      - ".github/workflows/protocol-ci.yml"
  pull_request:
  workflow_dispatch:
jobs:
  checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Syntax
        run: python -m compileall -q experiments/EXP-0001
      - name: Unit tests
        run: python -m unittest discover -s experiments/EXP-0001/tests -v
      - name: Verify pinned source bytes remotely
        run: python experiments/EXP-0001/prepare_source.py
      - name: Audit every source line and proposition citation
        run: python experiments/EXP-0001/validate_extraction.py
      - name: Count independent semantic adjudication decisions
        run: python experiments/EXP-0001/audit_review_decisions.py
      - name: Confirm no unearned experiment freeze
        run: |
          python - <<'PY'
          import pathlib
          root = pathlib.Path("experiments/EXP-0001")
          assert (root / "source_manifest.json").is_file()
          if not (root / "freeze.json").is_file():
              print("UNFROZEN: no live model runs authorized")
          PY
